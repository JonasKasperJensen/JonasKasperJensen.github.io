{{ define "main" }}
<header class="post-header shell">
  <a class="back-link" href="{{ site.Home.RelPermalink }}">← Back to feed</a>
  <a class="post-name" href="{{ site.Home.RelPermalink }}">{{ partial "profile-name.html" . }}</a>
</header>
<main id="main" class="post shell">
  <h1 class="visually-hidden">Photographs from {{ .Date.Format "2 January 2006" }}</h1>
  <div class="post-meta">
    {{ with .Params.caption }}<p>{{ . }}</p>{{ end }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
  </div>
  {{ $post := . }}
  {{ range .Params.images }}
    <img class="post-image" src="{{ partial "media-url.html" . }}" alt="{{ $post.Params.alt | default "Photograph" }}" loading="lazy" decoding="async">
  {{ end }}
</main>
{{ end }}
